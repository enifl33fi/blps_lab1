spring:
  application:
    name: blps-lab1-camunda
  
  # Database configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/blps2
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  
  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # Mail configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:user}
    password: ${MAIL_PASSWORD:password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Camunda BPM configuration
camunda:
  bpm:
    admin-user:
      id: admin
      password: admin
      firstName: Admin
    filter:
      create: All tasks
    form:
      enabled: true
      resource-path: classpath:forms/
    generic-properties:
      properties:
        historyTimeToLive: P1D
    # Enable Camunda REST API
    rest:
      enabled: true
    
    # Database configuration for Camunda
    database:
      schema-update: true
      type: postgres
    
    # Standalone configuration
    standalone:
      enabled: true
    
    # Webapp configuration
    webapp:
      application-path: /camunda
    
    # Default job executor
    default-job-executor:
      enabled: true
      max-jobs-per-acquisition: 3
      wait-time-in-millis: 5000
      max-wait: 1000
    
    # Metrics configuration
    metrics:
      enabled: true
    
    # History configuration
    history-level: full
    
    # Authorization configuration
    authorization:
      enabled: true
      enabled-for-custom-code: true

# ActiveMQ configuration
activemq:
  broker-url: tcp://localhost:61616
  user: admin
  password: admin
  pool:
    enabled: false

# JMS configuration
jms:
  cache:
    enabled: false

# Atomikos configuration
atomikos:
  properties:
    max-timeout: 900000
  log-base-dir: ./transaction_logs

# MQTT configuration
mqtt:
  broker:
    url: tcp://localhost:1883

# YTsaurus configuration
ytsaurus:
  table: //home/statistics
  cluster: localhost:8000
  endpoint: localhost:8001
  token: ""

# Admin user configuration
admin:
  email: admin@example.com
  password: admin123

# Server configuration
server:
  port: 8080

# Logging configuration
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.enifl33fi.lab1: DEBUG
    org.camunda.bpm: DEBUG
    org.springframework.security: DEBUG
