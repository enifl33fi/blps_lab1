<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camunda Lab1 Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="mb-4">Camunda Lab1 Demo</h1>
    <div class="row g-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">Регистрация</div>
                <div class="card-body">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="regEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="regEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="regPassword" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="regPassword" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">Логин</div>
                <div class="card-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="loginEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="loginPassword" required>
                        </div>
                        <button type="submit" class="btn btn-success">Войти</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="row g-4 mt-2">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">Подтверждение OTP</div>
                <div class="card-body">
                    <form id="otpForm">
                        <div class="mb-3">
                            <label for="otp" class="form-label">OTP</label>
                            <input type="text" class="form-control" id="otp" required>
                        </div>
                        <button type="submit" class="btn btn-warning">Подтвердить</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">Подписка/Отписка</div>
                <div class="card-body">
                    <form id="subscribeForm">
                        <div class="mb-3">
                            <label for="offerId" class="form-label">ID услуги</label>
                            <input type="number" class="form-control" id="offerId" required>
                        </div>
                        <div class="mb-3">
                            <label for="duration" class="form-label">Длительность (мес.)</label>
                            <input type="number" class="form-control" id="duration" required>
                        </div>
                        <div class="mb-3">
                            <label for="action" class="form-label">Действие</label>
                            <select class="form-select" id="action">
                                <option value="subscribe">Подписаться</option>
                                <option value="unsubscribe">Отписаться</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-info">Выполнить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="row mt-4">
        <div class="col">
            <div id="result" class="alert d-none"></div>
        </div>
    </div>
</div>
<script>
const apiBase = '/api';

function showResult(message, type = 'success') {
    const result = document.getElementById('result');
    result.className = `alert alert-${type}`;
    result.textContent = message;
    result.classList.remove('d-none');
}

document.getElementById('registerForm').onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('regEmail').value;
    const password = document.getElementById('regPassword').value;
    try {
        const res = await fetch(`${apiBase}/auth/register`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, password})
        });
        const data = await res.json();
        if (res.ok) showResult('Регистрация успешна! Проверьте почту для OTP.');
        else showResult(data.message || 'Ошибка регистрации', 'danger');
    } catch (err) { showResult('Ошибка сети', 'danger'); }
};

document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    try {
        const res = await fetch(`${apiBase}/auth/login`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, password})
        });
        const data = await res.json();
        if (res.ok) showResult('Вход выполнен!');
        else showResult(data.message || 'Ошибка входа', 'danger');
    } catch (err) { showResult('Ошибка сети', 'danger'); }
};

document.getElementById('otpForm').onsubmit = async (e) => {
    e.preventDefault();
    const otp = document.getElementById('otp').value;
    try {
        const res = await fetch(`${apiBase}/auth/confirm`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({otp})
        });
        const data = await res.json();
        if (res.ok) showResult('OTP подтвержден!');
        else showResult(data.message || 'Ошибка подтверждения', 'danger');
    } catch (err) { showResult('Ошибка сети', 'danger'); }
};

document.getElementById('subscribeForm').onsubmit = async (e) => {
    e.preventDefault();
    const id = document.getElementById('offerId').value;
    const durationInMonths = document.getElementById('duration').value;
    const action = document.getElementById('action').value;
    try {
        const res = await fetch(`${apiBase}/process/subscribe`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id, durationInMonths, action})
        });
        const data = await res.json();
        if (res.ok) showResult('Операция выполнена!');
        else showResult(data.message || 'Ошибка операции', 'danger');
    } catch (err) { showResult('Ошибка сети', 'danger'); }
};
</script>
</body>
</html>
